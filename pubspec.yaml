name: laundry_customer_app
description: Premium Laundry Customer App

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  dio: ^5.9.0
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.0
  flutter_svg: ^2.2.0
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.0
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1
  intl: ^0.20.2
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  record: ^5.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/banners/
    - assets/animations/
    - assets/illustrations/
    - assets/logos/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
